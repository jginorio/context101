version: 1
applications:
  - appRoot: web
    backend:
      phases:
        build:
          commands:
            - npm install --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - npm install --cache .npm --prefer-offline
        build:
          commands:
            # Amplify exposes console/branch env vars to the build container,
            # but Next.js SSR compute does not receive them at runtime unless
            # they are written to a Next-recognized env file before build.
            - env | grep -E '^(APP_MODE|ALLOW_PUBLIC_SIGNUP|BILLING_ENABLED|APP_URL|MARKETING_URL|BETTER_AUTH_SECRET|BETTER_AUTH_URL|DATABASE_URL|DATABASE_DRIVER|DATABASE_PREPARE|MCP_TOKEN_PEPPER|BRAINS_TABLE|BRAIN_PROVISIONER_FN_NAME|DOCS_BUCKET|SUGGESTIONS_TABLE|CONNECTORS_TABLE|CONNECTOR_TOKEN_SECRET_PREFIX|CONNECTOR_SYNC_SHEETS_FN_NAME|CONNECTOR_SYNC_DOCS_FN_NAME|CONNECTOR_SYNC_SLIDES_FN_NAME|CONNECTOR_SYNC_NOTION_FN_NAME|CONNECTOR_SYNC_GITHUB_FN_NAME|NOTION_OAUTH_CLIENT_SECRET_ID|GOOGLE_OAUTH_CLIENT_SECRET_ID|WIKI_CLUSTER_ARN|WIKI_TASK_DEF_ARN|WIKI_SUBNET_IDS|WIKI_SECURITY_GROUP_ID|START_WIKI_GEN_FN_NAME)=' >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
          - .npm/**/*
