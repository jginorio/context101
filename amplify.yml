version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            # Monorepo: site/web/packages are npm workspaces with a single root
            # lockfile, so deps install from the repo root (web/ has no lockfile
            # of its own). cwd persists across Amplify phases, so cd back into
            # web/ at the end — the build phase below runs there.
            #
            # `npm ci` — install EXACTLY the committed lockfile. The previous
            # `rm package-lock.json && npm install` hack (macOS lockfiles used
            # to omit linux-x64 native binaries) made every build resolve
            # dependencies fresh, so prod silently ran different versions than
            # anyone tested locally — it shipped better-auth 1.7.2 while the
            # lockfile pins 1.6.11, breaking sign-in. The lockfile now records
            # all platforms' native binaries (lightningcss / @tailwindcss/oxide
            # / @next/swc linux entries are present), so `npm ci` builds clean
            # on the linux container. If a future macOS npm regenerates the
            # lockfile without them, fix the lockfile (regenerate on linux or
            # with `npm install --os=linux --cpu=x64` entries), don't delete it.
            - cd .. && npm ci --cache .npm && cd web
        build:
          commands:
            # Amplify exposes console/branch env vars to the build container,
            # but Next.js SSR compute does not receive them at runtime unless
            # they are written to a Next-recognized env file before build.
            - env | grep -E '^(APP_MODE|ALLOW_PUBLIC_SIGNUP|BILLING_ENABLED|APP_URL|MARKETING_URL|BETTER_AUTH_SECRET|BETTER_AUTH_URL|DATABASE_URL|DATABASE_DRIVER|DATABASE_PREPARE|MCP_TOKEN_PEPPER|BRAIN_PROVISIONER_FN_NAME|DOCS_BUCKET|CONNECTOR_TOKEN_SECRET_PREFIX|CONNECTOR_SYNC_SHEETS_FN_NAME|CONNECTOR_SYNC_DOCS_FN_NAME|CONNECTOR_SYNC_SLIDES_FN_NAME|CONNECTOR_SYNC_NOTION_FN_NAME|CONNECTOR_SYNC_GITHUB_FN_NAME|NOTION_OAUTH_CLIENT_SECRET_ID|GOOGLE_OAUTH_CLIENT_SECRET_ID|WIKI_CLUSTER_ARN|WIKI_TASK_DEF_ARN|WIKI_SUBNET_IDS|WIKI_SECURITY_GROUP_ID|START_WIKI_GEN_FN_NAME)=' >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          # node_modules + npm cache live at the repo root under workspaces
          - .next/cache/**/*
          - ../node_modules/**/*
          - ../.npm/**/*
